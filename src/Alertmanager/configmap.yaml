# Alertmanager routing, grouping, inhibition, and receiver configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      # Automatically resolve an alert if Prometheus stops firing it for 5 minutes
      resolve_timeout: 5m

    # Root routing tree: groups related alerts to prevent notification storms
    route:
      group_by: ['alertname', 'namespace', 'app']
      # Wait briefly for related alerts in the same incident before notifying
      group_wait: 10s
      # Wait before sending newly added alerts to an already active group
      group_interval: 30s
      # Re-notify if an unresolved alert keeps firing
      repeat_interval: 1h
      receiver: 'default-receiver'

      # Severity-based child routes
      routes:
        - matchers:
            - severity="critical"
          receiver: 'critical-alerts'
          group_wait: 5s
          repeat_interval: 15m
        - matchers:
            - severity="warning"
          receiver: 'warning-alerts'
          group_wait: 15s
          repeat_interval: 1h

    # Suppress lower-severity warnings when a critical alert is already active for the same app
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ['app', 'namespace']

    # Notification receivers (visible in Alertmanager UI; add Slack/Webhook/Email via Secrets in production)
    receivers:
      - name: 'default-receiver'
      - name: 'critical-alerts'
        # Example production webhook/Slack integration (store webhook URL in a Kubernetes Secret):
        # slack_configs:
        #   - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        #     channel: '#sre-critical-alerts'
      - name: 'warning-alerts'
        # webhook_configs:
        #   - url: 'http://example-webhook-receiver:8080/alerts'
