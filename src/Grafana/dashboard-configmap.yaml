# Provision the Orders App SRE Observability dashboard automatically on Grafana startup
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app: grafana
data:
  # Tell Grafana to load all JSON dashboards placed inside /etc/grafana/provisioning/dashboards
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards

  # RED Method (Rate, Errors, Duration) + Kubernetes Container Saturation dashboard for orders-app
  orders-app-dashboard.json: |
    {
      "id": null,
      "uid": "orders-app-observability",
      "title": "Orders App - SRE Observability",
      "tags": ["sre", "orders-app", "fastapi"],
      "style": "dark",
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Total Request Rate",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{app=\"orders-app\"}[5m])) or vector(0)"
            }
          ]
        },
        {
          "id": 2,
          "title": "HTTP Error Rate (4xx/5xx)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(http_requests_total{app=\"orders-app\", status=~\"4..|5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(http_requests_total{app=\"orders-app\"}[5m])), 1e-9) * 100"
            }
          ]
        },
        {
          "id": 3,
          "title": "Requests In Progress",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(http_requests_in_progress{app=\"orders-app\"}) or vector(0)"
            }
          ]
        },
        {
          "id": 4,
          "title": "HTTP Request Rate by Endpoint & Status",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{app=\"orders-app\"}[5m])) by (method, endpoint, status)",
              "legendFormat": "{{method}} {{endpoint}} ({{status}})"
            }
          ]
        },
        {
          "id": 5,
          "title": "HTTP Request Latency (p95 & Average)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{app=\"orders-app\"}[5m])) by (le, endpoint))",
              "legendFormat": "p95 - {{endpoint}}"
            },
            {
              "refId": "B",
              "expr": "sum(rate(http_request_duration_seconds_sum{app=\"orders-app\"}[5m])) / sum(rate(http_request_duration_seconds_count{app=\"orders-app\"}[5m]))",
              "legendFormat": "avg (all endpoints)"
            }
          ]
        },
        {
          "id": 6,
          "title": "Container CPU Usage by Pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\", container=\"orders-app\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Container Memory Working Set by Pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"default\", container=\"orders-app\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
